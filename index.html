<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Botanique - Reconnaissance visuelle</title>
<style>
  :root {
    --green-dark: #1e4620;
    --green: #2f7a3d;
    --green-light: #a8d5ac;
    --green-bg: #f2f8f0;
    --red: #c0392b;
    --red-bg: #fdecea;
    --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, var(--green-bg), #e6f2e6);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(30,70,32,0.15);
    max-width: 520px;
    width: 100%;
    padding: 28px;
  }
  h1 {
    color: var(--green-dark);
    text-align: center;
    margin-top: 0;
    font-size: 1.5em;
  }
  .subtitle {
    text-align: center;
    color: var(--gray);
    margin-bottom: 18px;
    font-size: 0.9em;
  }
  .progress-bar {
    background: #e2e2e2;
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    background: var(--green);
    height: 100%;
    width: 0%;
    transition: width 0.4s ease;
  }
  .image-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #eef4ee;
    border: 2px dashed var(--green-light);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    position: relative;
  }
  .image-wrap img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    max-width: none;
    transform-origin: 0 0;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .image-wrap img.dragging {
    cursor: grabbing;
  }
  .image-wrap img.zoom-transition {
    transition: transform 0.2s ease;
  }
  .image-reset-btn {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(255,255,255,0.85);
    border: none;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.75em;
    color: var(--green-dark);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    display: none;
  }
  .image-zoom-controls {
    position: absolute;
    bottom: 8px;
    left: 8px;
    display: flex;
    gap: 4px;
  }
  .zoom-btn {
    background: rgba(255,255,255,0.85);
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    font-size: 1.1em;
    line-height: 1;
    color: var(--green-dark);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-btn:hover:not(:disabled) { background: #fff; }
  .zoom-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .image-drag-hint {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(255,255,255,0.85);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.7em;
    color: var(--gray);
    pointer-events: none;
  }
  .image-placeholder-text {
    color: var(--gray);
    font-size: 0.85em;
    text-align: center;
    padding: 10px;
  }
  .image-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.85);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1.1em;
    cursor: pointer;
    color: var(--green-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .image-nav-btn:hover { background: #fff; }
  .image-nav-btn.prev { left: 10px; }
  .image-nav-btn.next { right: 10px; }
  .image-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }
  .image-dots .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d8e4d8;
    cursor: pointer;
  }
  .image-dots .dot.active {
    background: var(--green);
  }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 0.85em;
    color: var(--green-dark);
    font-weight: 600;
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 2px solid #d8e4d8;
    font-size: 1em;
    background: #fafcfa;
    transition: all 0.15s ease;
  }
  .field input:focus {
    outline: none;
    border-color: var(--green);
  }
  .field input.correct {
    border-color: var(--green);
    background: #e8f5e9;
    color: var(--green-dark);
  }
  .field input.incorrect {
    border-color: var(--red);
    background: var(--red-bg);
    color: var(--red);
  }
  .field .answer-reveal {
    font-size: 0.8em;
    color: var(--red);
    margin-top: 4px;
    display: none;
  }
  .field .answer-reveal.show {
    display: block;
  }
  .result-banner {
    text-align: center;
    font-weight: 600;
    margin: 14px 0;
    min-height: 20px;
    font-size: 0.95em;
  }
  .result-banner.ok { color: var(--green-dark); }
  .result-banner.ko { color: var(--red); }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 10px;
  }
  .score-label {
    color: var(--gray);
    font-size: 0.85em;
  }
  .btn-group {
    display: flex;
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 8px;
    font-size: 0.95em;
    cursor: pointer;
    padding: 10px 18px;

    background: var(--green);
    color: white;

  button.skip {
    background: transparent;
    color: var(--gray);

  .result {

    inset: 0;
    background: rgba(242, 248, 240, 0.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    z-index: 5;

  .loading-spinner {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    to { transform: rotate(360deg); }
  }
  .loading-text {
    color: var(--green-dark);
    font-weight: 600;
    font-size: 0.85em;
  }
</style>
</head>
<body>

<div class="card">
  <div class="leaf">🌿</div>
  <h1>Quiz de Botanique</h1>
  <div class="subtitle">Identifiez la plante à partir de la photo</div>

  <div id="quiz-screen">

    <div class="image-wrap">
      <img id="plant-image" src="" alt="Photo de la plante à identifier" draggable="false"
           ondragstart="return false;"
           onerror="this.style.display='none'; document.getElementById('img-placeholder').style.display='flex'; document.getElementById('image-loading-overlay').style.display='none';">
      <div class="image-placeholder-text" id="img-placeholder" style="display:none; flex-direction:column;">
        📷 Image non trouvée<br>
        <span id="img-path-hint" style="font-size:0.8em; opacity:0.7;"></span>
      </div>
      <button class="image-nav-btn prev" id="img-prev" style="display:none;">‹</button>
      <button class="image-nav-btn next" id="img-next" style="display:none;">›</button>
      <div class="image-drag-hint" id="image-drag-hint">✥ glisser pour déplacer</div>
      <button class="image-reset-btn" id="img-reset">Recentrer</button>
      <div class="image-zoom-controls" id="image-zoom-controls" style="display:none;">
        <button class="zoom-btn" id="zoom-out-btn" title="Zoom arrière" type="button">−</button>
        <button class="zoom-btn" id="zoom-in-btn" title="Zoom avant" type="button">+</button>
      </div>
      <div class="image-loading-overlay" id="image-loading-overlay" style="display:none;">
        <div class="loading-spinner"></div>
        <div class="loading-text">Chargement de l'image…</div>
      </div>
    </div>
    <div class="image-dots" id="image-dots"></div>

    <div class="field">
      <label for="input-family">Famille</label>
      <input type="text" id="input-family" list="list-family" autocomplete="off" placeholder="ex : PINACEES ou PINACEAE">
      <div class="answer-reveal" id="reveal-family"></div>
    </div>

    <div class="field">
      <label for="input-scientific">Nom scientifique</label>
      <input type="text" id="input-scientific" autocomplete="off" placeholder="ex : Pinus sylvestris">
      <div class="answer-reveal" id="reveal-scientific"></div>
    </div>

    <div class="field">
      <label for="input-common">Nom commun</label>
      <input type="text" id="input-common" list="list-common" autocomplete="off" placeholder="ex : Pin sylvestre (suggestions à partir de 3 caractères)">
      <div class="answer-reveal" id="reveal-common"></div>
    </div>

    <datalist id="list-common"></datalist>
    <datalist id="list-family"></datalist>

    <div class="result-banner" id="result-banner"></div>

    <div class="footer">
      <div class="score-label" id="score-label">Score : 0 / 0</div>
      <div class="btn-group">
        <button class="skip" id="skip-btn">Passer</button>
        <button class="validate" id="validate-btn">Valider</button>
      </div>
    </div>
  </div>

  <div id="result-screen" style="display:none;" class="result">
    <h2>Quiz terminé !</h2>
    <div class="score" id="final-score"></div>
    <p id="result-message"></p>
    <div class="missed-list" id="missed-list" style="display:none;"></div>
    <button class="restart" id="restart-btn">Recommencer</button>
  </div>
</div>

let order = [];

const allCommons = [...new Set(plants.map(p => p.common))].sort();
const allFamilies = [...new Set(plants.map(p => p.family))].sort();

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(str) {
  return str
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // enlève les accents
    .toLowerCase()
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/[’']/g, "'");
}

/* Normalisation spécifique au nom de famille : accepte indifféremment
   les terminaisons "-acees" (ex : ROSACEES) et "-aceae" (ex : ROSACEAE),
   qui désignent la même famille botanique. */
function normalizeFamily(str) {
  return normalize(str).replace(/acees$/, 'aceae');
}

/* ============================================================
   DÉPLACEMENT (DRAG) ET ZOOM DE L'IMAGE DANS SON CADRE
   L'image est affichée à sa taille "couvrante" (comme object-fit:
   cover), multipliée par un niveau de zoom réglable. On peut la
   faire glisser (souris, doigt) pour révéler les parties masquées,
   et zoomer via la molette, les boutons +/-, le double-clic, ou
   le pincement à deux doigts sur tactile.
   ============================================================ */
let dragOffsetX = 0;
let dragOffsetY = 0;
let dragBoundsX = [0, 0];
let dragBoundsY = [0, 0];
let isDraggingImg = false;
let dragStartX = 0;
let dragStartY = 0;
let dragStartOffsetX = 0;
let dragStartOffsetY = 0;
let imgHasOverflow = false;

let imgNaturalW = 0;
let imgNaturalH = 0;
let baseScale = 1;
let zoomScale = 1;
const MIN_ZOOM = 1;
const MAX_ZOOM = 4;
const ZOOM_STEP = 0.4;

function applyImageTransform() {
  imgEl.style.transform = `translate(${dragOffsetX}px, ${dragOffsetY}px) scale(${zoomScale})`;
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

/* Fixe la taille "de base" (couvrante, zoom x1) de l'image dans le DOM.
   Cette taille ne change QUE lors du chargement d'une image ou d'un
   redimensionnement de fenêtre — jamais pendant un zoom, pour éviter
   toute recalcul de mise en page (layout) pendant l'animation. */
function setBaseImageSize() {
  imgEl.style.width = (imgNaturalW * baseScale) + 'px';
  imgEl.style.height = (imgNaturalH * baseScale) + 'px';
}

function applyImageSize(recenter) {
  if (!imgNaturalW || !imgNaturalH) return;
  const frameW = imageWrapEl.clientWidth;
  const frameH = imageWrapEl.clientHeight;
  const renderedW = imgNaturalW * baseScale * zoomScale;
  const renderedH = imgNaturalH * baseScale * zoomScale;

  // Bornes : l'image ne doit jamais laisser de vide dans le cadre
  dragBoundsX = [Math.min(0, frameW - renderedW), 0];
  dragBoundsY = [Math.min(0, frameH - renderedH), 0];

  if (recenter) {
    dragOffsetX = dragBoundsX[0] / 2;
    dragOffsetY = dragBoundsY[0] / 2;
  } else {
    dragOffsetX = clamp(dragOffsetX, dragBoundsX[0], dragBoundsX[1]);
    dragOffsetY = clamp(dragOffsetY, dragBoundsY[0], dragBoundsY[1]);
  }
  applyImageTransform();

  imgHasOverflow = (renderedW - frameW > 2) || (renderedH - frameH > 2);
  imgResetBtn.style.display = (imgHasOverflow || zoomScale > MIN_ZOOM) ? 'block' : 'none';
  imageDragHint.style.display = imgHasOverflow ? 'block' : 'none';
  zoomOutBtn.disabled = zoomScale <= MIN_ZOOM + 0.001;
  zoomInBtn.disabled = zoomScale >= MAX_ZOOM - 0.001;
}

function fitImageToFrame() {
  imgNaturalW = imgEl.naturalWidth;
  imgNaturalH = imgEl.naturalHeight;
  if (!imgNaturalW || !imgNaturalH) return;

  const frameW = imageWrapEl.clientWidth;
  const frameH = imageWrapEl.clientHeight;
  baseScale = Math.max(frameW / imgNaturalW, frameH / imgNaturalH);
  zoomScale = 1;
  setBaseImageSize();
  applyImageSize(true);
  imageZoomControls.style.display = 'flex';
}

let zoomTransitionTimeout = null;

/* Zoome en gardant le point (clientX, clientY) fixe à l'écran
   (centre du cadre si non précisé) — comme un zoom "vers le curseur".
   smooth=true anime la transition (boutons, molette, double-clic) ;
   smooth=false l'évite pendant un pincement tactile continu. */
function setZoom(newZoom, anchorClientX, anchorClientY, smooth = true) {
  if (!imgNaturalW || !imgNaturalH) return;
  newZoom = clamp(newZoom, MIN_ZOOM, MAX_ZOOM);
  if (Math.abs(newZoom - zoomScale) < 0.001) return;

  const rect = imageWrapEl.getBoundingClientRect();
  const anchorX = anchorClientX !== undefined ? anchorClientX - rect.left : rect.width / 2;
  const anchorY = anchorClientY !== undefined ? anchorClientY - rect.top : rect.height / 2;

  const oldRenderedW = imgNaturalW * baseScale * zoomScale;
  const oldRenderedH = imgNaturalH * baseScale * zoomScale;
  const ratioX = (anchorX - dragOffsetX) / oldRenderedW;
  const ratioY = (anchorY - dragOffsetY) / oldRenderedH;

  zoomScale = newZoom;
  const newRenderedW = imgNaturalW * baseScale * zoomScale;
  const newRenderedH = imgNaturalH * baseScale * zoomScale;

  dragOffsetX = anchorX - ratioX * newRenderedW;
  dragOffsetY = anchorY - ratioY * newRenderedH;

  if (smooth) {
    imgEl.classList.add('zoom-transition');
    clearTimeout(zoomTransitionTimeout);
    zoomTransitionTimeout = setTimeout(() => imgEl.classList.remove('zoom-transition'), 220);
  } else {
    imgEl.classList.remove('zoom-transition');
  }

  applyImageSize(false);
}

function startDrag(clientX, clientY) {
  if (!imgHasOverflow) return;
  isDraggingImg = true;
  dragStartX = clientX;
  dragStartY = clientY;
  dragStartOffsetX = dragOffsetX;
  dragStartOffsetY = dragOffsetY;
  clearTimeout(zoomTransitionTimeout);
  imgEl.classList.remove('zoom-transition');
  imgEl.classList.add('dragging');
}

function moveDrag(clientX, clientY) {
  if (!isDraggingImg) return;
  const dx = clientX - dragStartX;
  const dy = clientY - dragStartY;
  dragOffsetX = clamp(dragStartOffsetX + dx, dragBoundsX[0], dragBoundsX[1]);
  dragOffsetY = clamp(dragStartOffsetY + dy, dragBoundsY[0], dragBoundsY[1]);
  applyImageTransform();
}

function endDrag() {
  isDraggingImg = false;
  imgEl.classList.remove('dragging');
}

imgEl.addEventListener('dragstart', (e) => e.preventDefault());

/* Gestion combinée glisser (1 doigt / souris) et pincement (2 doigts) */
const activePointers = new Map();
let pinchStartDistance = null;
let pinchStartZoom = 1;

function pointerDistance() {
  const pts = [...activePointers.values()];
  const dx = pts[0].x - pts[1].x;
  const dy = pts[0].y - pts[1].y;
  return Math.sqrt(dx * dx + dy * dy);
}
function pointersMidpoint() {
  const pts = [...activePointers.values()];
  return { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
}

imgEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  imgEl.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 2) {
    isDraggingImg = false;
    imgEl.classList.remove('dragging');
    pinchStartDistance = pointerDistance();
    pinchStartZoom = zoomScale;
  } else if (activePointers.size === 1) {
    startDrag(e.clientX, e.clientY);
  }
});

imgEl.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size === 2 && pinchStartDistance) {
    e.preventDefault();
    const newDistance = pointerDistance();
    const mid = pointersMidpoint();
    setZoom(pinchStartZoom * (newDistance / pinchStartDistance), mid.x, mid.y, false);
  } else if (activePointers.size === 1) {
    if (isDraggingImg) e.preventDefault();
    moveDrag(e.clientX, e.clientY);
  }
});

function releasePointer(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size < 2) {
    pinchStartDistance = null;
  }
  if (activePointers.size === 0) {
    endDrag();
  } else if (activePointers.size === 1) {
    const remaining = [...activePointers.values()][0];
    startDrag(remaining.x, remaining.y);
  }
}
imgEl.addEventListener('pointerup', (e) => { e.preventDefault(); releasePointer(e); });
imgEl.addEventListener('pointercancel', releasePointer);

// Molette de souris : zoom avant/arrière centré sur le curseur
imageWrapEl.addEventListener('wheel', (e) => {
  if (!imgNaturalW) return;
  e.preventDefault();
  const delta = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
  setZoom(zoomScale + delta, e.clientX, e.clientY);
}, { passive: false });

// Double-clic / double-tap : bascule entre zoom x1 et x2
imgEl.addEventListener('dblclick', (e) => {
  setZoom(zoomScale > MIN_ZOOM ? MIN_ZOOM : 2, e.clientX, e.clientY);
});

imgEl.addEventListener('load', () => {
  imageLoadingOverlay.style.display = 'none';
  fitImageToFrame();
});
window.addEventListener('resize', () => {
  if (imgEl.style.display !== 'none' && imgNaturalW) {
    const frameW = imageWrapEl.clientWidth;
    const frameH = imageWrapEl.clientHeight;
    baseScale = Math.max(frameW / imgNaturalW, frameH / imgNaturalH);
    setBaseImageSize();
    applyImageSize(true);
  }
});

imgResetBtn.addEventListener('click', () => {
  zoomScale = 1;
  imgEl.classList.add('zoom-transition');
  clearTimeout(zoomTransitionTimeout);
  zoomTransitionTimeout = setTimeout(() => imgEl.classList.remove('zoom-transition'), 220);
  applyImageSize(true);
});

zoomInBtn.addEventListener('click', () => setZoom(zoomScale + ZOOM_STEP));
zoomOutBtn.addEventListener('click', () => setZoom(zoomScale - ZOOM_STEP));

/* Autocomplétion dynamique : les suggestions n'apparaissent
   qu'à partir de 3 caractères saisis, et uniquement pour les
   champs "nom commun" et "famille". */
function setupDynamicAutocomplete(input, datalistEl, sourceList) {
  input.addEventListener('input', () => {
    const val = input.value;
    if (val.trim().length < 3) {
      datalistEl.innerHTML = '';
      return;
    }
    const normVal = normalize(val);
    const matches = sourceList
      .filter(item => normalize(item).includes(normVal))
      .slice(0, 8);
    datalistEl.innerHTML = matches.map(v => `<option value="${v}">`).join('');
  });
}

function loadQuestion() {
  solvedCurrent = false;
  currentImageIndex = 0;
  resultBanner.textContent = '';
  resultBanner.className = 'result-banner';
  [inputCommon, inputScientific, inputFamily].forEach(inp => {
    inp.value = '';
    inp.classList.remove('correct', 'incorrect');
    inp.disabled = false;
  });
  datalistCommon.innerHTML = '';
  datalistFamily.innerHTML = '';
  [revealCommon, revealScientific, revealFamily].forEach(r => {
    r.classList.remove('show');
    r.textContent = '';
  });
  validateBtn.textContent = 'Valider';
  validateBtn.disabled = false;
  skipBtn.style.display = 'inline-block';
  skipBtn.disabled = false;

  loadImage();
  updateProgress();
  updateScoreLabel();
  inputFamily.focus();
}

function loadImage() {
  const plant = order[currentIndex];
  const images = plant.images && plant.images.length ? plant.images : [];
  imgEl.style.display = 'block';
  imgPlaceholder.style.display = 'none';

  // Réinitialise le drag/pan/zoom avant le chargement de la nouvelle image
  isDraggingImg = false;
  imgHasOverflow = false;
  dragOffsetX = 0;
  dragOffsetY = 0;
  zoomScale = 1;
  imgNaturalW = 0;
  imgNaturalH = 0;
  activePointers.clear();
  pinchStartDistance = null;
  imgEl.style.width = '100%';
  imgEl.style.height = '100%';
  imgEl.style.transform = 'translate(0px, 0px)';
  imgResetBtn.style.display = 'none';
  imageDragHint.style.display = 'none';
  imageZoomControls.style.display = 'none';

  if (images.length > 0) {
    imageLoadingOverlay.style.display = 'flex';
    imgEl.src = images[currentImageIndex];
    imgPathHint.textContent = images[currentImageIndex];
  } else {
    imageLoadingOverlay.style.display = 'none';
    imgEl.src = '';
    imgPathHint.textContent = '(aucune image renseignée)';
  }

  const multi = images.length > 1;
  imgPrevBtn.style.display = multi ? 'flex' : 'none';
  imgNextBtn.style.display = multi ? 'flex' : 'none';

  imageDots.innerHTML = '';
  if (multi) {
    images.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === currentImageIndex ? ' active' : '');
      dot.addEventListener('click', () => {
        currentImageIndex = i;
        loadImage();
      });
      imageDots.appendChild(dot);
    });
  }
}

imgPrevBtn.addEventListener('click', () => {
  const plant = order[currentIndex];
  const total = plant.images.length;
  currentImageIndex = (currentImageIndex - 1 + total) % total;
  loadImage();
});

imgNextBtn.addEventListener('click', () => {
  const plant = order[currentIndex];
  const total = plant.images.length;
  currentImageIndex = (currentImageIndex + 1) % total;
  loadImage();
});

function updateProgress() {
  const pct = (currentIndex / order.length) * 100;
  progressFill.style.width = pct + '%';
}

function updateScoreLabel() {
  scoreLabel.textContent = `Score : ${score} / ${order.length}`;
}

function checkAnswers() {
  const plant = order[currentIndex];
  const userCommon = normalize(inputCommon.value);
  const userScientific = normalize(inputScientific.value);
  const userFamily = normalizeFamily(inputFamily.value);

  const okCommon = userCommon === normalize(plant.common);
  const okScientific = userScientific === normalize(plant.scientific);
  const okFamily = userFamily === normalizeFamily(plant.family);

  inputCommon.classList.toggle('correct', okCommon);
  inputCommon.classList.toggle('incorrect', !okCommon);
  inputScientific.classList.toggle('correct', okScientific);
  inputScientific.classList.toggle('incorrect', !okScientific);
  inputFamily.classList.toggle('correct', okFamily);
  inputFamily.classList.toggle('incorrect', !okFamily);

  if (!okCommon) { revealCommon.textContent = 'Réponse : ' + plant.common; revealCommon.classList.add('show'); }
  if (!okScientific) { revealScientific.textContent = 'Réponse : ' + plant.scientific; revealScientific.classList.add('show'); }
  if (!okFamily) { revealFamily.textContent = 'Réponse : ' + plant.family; revealFamily.classList.add('show'); }

  const allOk = okCommon && okScientific && okFamily;

  if (allOk) {
    resultBanner.textContent = '✅ Bravo, les trois réponses sont correctes !';
    resultBanner.className = 'result-banner ok';
    score++;
  } else {
    resultBanner.textContent = '❌ Au moins une réponse est incorrecte. La bonne réponse est affichée ci-dessus.';
    resultBanner.className = 'result-banner ko';
    missed.push(plant);
  }

  updateScoreLabel();
  solvedCurrent = true;
  validateBtn.textContent = 'Suivant →';
  skipBtn.style.display = 'none';
  [inputCommon, inputScientific, inputFamily].forEach(inp => inp.disabled = true);
}

function revealAnswersForSkip() {
  const plant = order[currentIndex];
  revealCommon.textContent = 'Réponse : ' + plant.common;
  revealCommon.classList.add('show');
  revealScientific.textContent = 'Réponse : ' + plant.scientific;
  revealScientific.classList.add('show');
  revealFamily.textContent = 'Réponse : ' + plant.family;
  revealFamily.classList.add('show');
}

validateBtn.addEventListener('click', () => {
  if (!solvedCurrent) {
    checkAnswers();
  } else {
    goToNext();
  }
});

skipBtn.addEventListener('click', () => {
  const plant = order[currentIndex];
  missed.push(plant);
  revealAnswersForSkip();
  resultBanner.textContent = 'Question passée — les réponses sont affichées ci-dessus.';
  resultBanner.className = 'result-banner ko';
  [inputCommon, inputScientific, inputFamily].forEach(inp => inp.disabled = true);
  skipBtn.style.display = 'none';
  validateBtn.textContent = 'Suivant →';
  solvedCurrent = true;
});

function goToNext() {
  currentIndex++;
  if (currentIndex < order.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  quizScreen.style.display = 'none';
  resultScreen.style.display = 'block';
  progressFill.style.width = '100%';
  finalScore.textContent = `${score} / ${order.length}`;
  const pct = Math.round((score / order.length) * 100);
  let msg;
  if (pct === 100) msg = "Parfait ! Vous maîtrisez toutes les plantes de la liste 🌱";
  else if (pct >= 70) msg = "Très bien ! Encore quelques révisions pour être imbattable 🌿";
  else if (pct >= 40) msg = "Pas mal, continuez à réviser les espèces manquées 🌾";
  else msg = "Encore du travail — revoyez les fiches des plantes ratées 🌻";
  resultMessage.textContent = msg;

  if (missed.length > 0) {
    missedList.style.display = 'block';
    missedList.innerHTML = '<strong>Plantes à revoir :</strong><ul>' +
      missed.map(p => `<li>${p.common} — <em>${p.scientific}</em> (${p.family})</li>`).join('') +
      '</ul>';
  } else {
    missedList.style.display = 'none';
  }
}

restartBtn.addEventListener('click', () => {
  currentIndex = 0;
  score = 0;
  missed = [];
  order = shuffle(plants);
  quizScreen.style.display = 'block';
  resultScreen.style.display = 'none';
  loadQuestion();
});

// Valider avec la touche Entrée
[inputCommon, inputScientific, inputFamily].forEach(inp => {
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      validateBtn.click();
    }
  });
});

// Initialisation
setupDynamicAutocomplete(inputCommon, datalistCommon, allCommons);
//setupDynamicAutocomplete(inputFamily, datalistFamily, allFamilies);
order = shuffle(plants);
loadQuestion();
</script>

</body>
