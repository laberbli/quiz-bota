<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Botanique - Reconnaissance visuelle</title>
<style>
  :root {
    --green-dark: #1e4620;
    --green: #2f7a3d;
    --green-light: #a8d5ac;
    --green-bg: #f2f8f0;
    --red: #c0392b;
    --red-bg: #fdecea;
    --gray: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, var(--green-bg), #e6f2e6);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(30,70,32,0.15);
    max-width: 520px;
    width: 100%;
    padding: 28px;
  }
  h1 {
    color: var(--green-dark);
    text-align: center;
    margin-top: 0;
    font-size: 1.5em;
  }
  .subtitle {
    text-align: center;
    color: var(--gray);
    margin-bottom: 18px;
    font-size: 0.9em;
  }
  .progress-bar {
    background: #e2e2e2;
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    background: var(--green);
    height: 100%;
    width: 0%;
    transition: width 0.4s ease;
  }
  .image-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #eef4ee;
    border: 2px dashed var(--green-light);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    position: relative;
  }
  .image-wrap img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    max-width: none;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .image-wrap img.dragging {
    cursor: grabbing;
  }
  .image-reset-btn {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(255,255,255,0.85);
    border: none;
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 0.75em;
    color: var(--green-dark);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    display: none;
  }
  .image-drag-hint {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(255,255,255,0.85);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 0.7em;
    color: var(--gray);
    pointer-events: none;
  }
  .image-placeholder-text {
    color: var(--gray);
    font-size: 0.85em;
    text-align: center;
    padding: 10px;
  }
  .image-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.85);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1.1em;
    cursor: pointer;
    color: var(--green-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .image-nav-btn:hover { background: #fff; }
  .image-nav-btn.prev { left: 10px; }
  .image-nav-btn.next { right: 10px; }
  .image-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
  }
  .image-dots .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #d8e4d8;
    cursor: pointer;
  }
  .image-dots .dot.active {
    background: var(--green);
  }
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 0.85em;
    color: var(--green-dark);
    font-weight: 600;
    margin-bottom: 5px;
  }
  .field input {
    width: 100%;
    padding: 11px 12px;
    border-radius: 8px;
    border: 2px solid #d8e4d8;
    font-size: 1em;
    background: #fafcfa;
    transition: all 0.15s ease;
  }
  .field input:focus {
    outline: none;
    border-color: var(--green);
  }
  .field input.correct {
    border-color: var(--green);
    background: #e8f5e9;
    color: var(--green-dark);
  }
  .field input.incorrect {
    border-color: var(--red);
    background: var(--red-bg);
    color: var(--red);
  }
  .field .answer-reveal {
    font-size: 0.8em;
    color: var(--red);
    margin-top: 4px;
    display: none;
  }
  .field .answer-reveal.show {
    display: block;
  }
  .result-banner {
    text-align: center;
    font-weight: 600;
    margin: 14px 0;
    min-height: 20px;
    font-size: 0.95em;
  }
  .result-banner.ok { color: var(--green-dark); }
  .result-banner.ko { color: var(--red); }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 10px;
  }
  .score-label {
    color: var(--gray);
    font-size: 0.85em;
  }
  .btn-group {
    display: flex;
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 8px;
    font-size: 0.95em;
    cursor: pointer;
    padding: 10px 18px;
  }
  button.validate {
    background: var(--green);
    color: white;
  }

  button.skip {
    background: transparent;
    color: var(--gray);

    height: 10px;

    width: 100%;
  }
  .loading-progress-fill {
    background: var(--green);
    height: 100%;
    width: 0%;
    transition: width 0.2s ease;
  }
</style>
</head>

<div class="card">

let order = [];

const imgEl = document.getElementById('plant-image');

const allCommons = [...new Set(plants.map(p => p.common))].sort();
const allFamilies = [...new Set(plants.map(p => p.family))].sort();

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalize(str) {
  return str
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // enlève les accents
    .toLowerCase()
    .trim()
    .replace(/\s+/g, ' ')
    .replace(/[’']/g, "'");
}

/* Normalisation spécifique au nom de famille : accepte indifféremment
   les terminaisons "-acees" (ex : ROSACEES) et "-aceae" (ex : ROSACEAE),
   qui désignent la même famille botanique. */
function normalizeFamily(str) {
  return normalize(str).replace(/acees$/, 'aceae');
}

/* ============================================================
   DÉPLACEMENT (DRAG) DE L'IMAGE DANS SON CADRE
   L'image est affichée à sa taille "couvrante" (comme object-fit:
   cover) mais reste plus grande que le cadre : on peut la faire
   glisser pour révéler les parties masquées.
   ============================================================ */
let dragOffsetX = 0;
let dragOffsetY = 0;
let dragBoundsX = [0, 0];
let dragBoundsY = [0, 0];
let isDraggingImg = false;
let dragStartX = 0;
let dragStartY = 0;
let dragStartOffsetX = 0;
let dragStartOffsetY = 0;
let imgHasOverflow = false;

function applyImageTransform() {
  imgEl.style.transform = `translate(${dragOffsetX}px, ${dragOffsetY}px)`;
}

function fitImageToFrame() {
  const naturalW = imgEl.naturalWidth;
  const naturalH = imgEl.naturalHeight;
  if (!naturalW || !naturalH) return;

  const frameW = imageWrapEl.clientWidth;
  const frameH = imageWrapEl.clientHeight;
  const scale = Math.max(frameW / naturalW, frameH / naturalH);
  const renderedW = naturalW * scale;
  const renderedH = naturalH * scale;

  imgEl.style.width = renderedW + 'px';
  imgEl.style.height = renderedH + 'px';

  // Bornes : l'image ne doit jamais laisser de vide dans le cadre
  dragBoundsX = [Math.min(0, frameW - renderedW), 0];
  dragBoundsY = [Math.min(0, frameH - renderedH), 0];

  // Centrage par défaut
  dragOffsetX = dragBoundsX[0] / 2;
  dragOffsetY = dragBoundsY[0] / 2;
  applyImageTransform();

  imgHasOverflow = (renderedW - frameW > 2) || (renderedH - frameH > 2);
  imgResetBtn.style.display = imgHasOverflow ? 'block' : 'none';
  imageDragHint.style.display = imgHasOverflow ? 'block' : 'none';
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

function startDrag(clientX, clientY) {
  if (!imgHasOverflow) return;
  isDraggingImg = true;
  dragStartX = clientX;
  dragStartY = clientY;
  dragStartOffsetX = dragOffsetX;
  dragStartOffsetY = dragOffsetY;
  imgEl.classList.add('dragging');
}

function moveDrag(clientX, clientY) {
  if (!isDraggingImg) return;
  const dx = clientX - dragStartX;
  const dy = clientY - dragStartY;
  dragOffsetX = clamp(dragStartOffsetX + dx, dragBoundsX[0], dragBoundsX[1]);
  dragOffsetY = clamp(dragStartOffsetY + dy, dragBoundsY[0], dragBoundsY[1]);
  applyImageTransform();
}

function endDrag() {
  isDraggingImg = false;
  imgEl.classList.remove('dragging');
}

imgEl.addEventListener('dragstart', (e) => e.preventDefault());

imgEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  startDrag(e.clientX, e.clientY);
  imgEl.setPointerCapture(e.pointerId);
});
imgEl.addEventListener('pointermove', (e) => {
  if (isDraggingImg) e.preventDefault();
  moveDrag(e.clientX, e.clientY);
});
imgEl.addEventListener('pointerup', (e) => {
  e.preventDefault();
  endDrag();
});
imgEl.addEventListener('pointercancel', endDrag);

imgEl.addEventListener('load', fitImageToFrame);
window.addEventListener('resize', () => {
  if (imgEl.style.display !== 'none') fitImageToFrame();
});

imgResetBtn.addEventListener('click', () => {
  dragOffsetX = dragBoundsX[0] / 2;
  dragOffsetY = dragBoundsY[0] / 2;
  applyImageTransform();
});

/* Autocomplétion dynamique : les suggestions n'apparaissent
   qu'à partir de 3 caractères saisis, et uniquement pour les
   champs "nom commun" et "famille". */
function setupDynamicAutocomplete(input, datalistEl, sourceList) {
  input.addEventListener('input', () => {
    const val = input.value;
    if (val.trim().length < 3) {
      datalistEl.innerHTML = '';
      return;
    }
    const normVal = normalize(val);
    const matches = sourceList
      .filter(item => normalize(item).includes(normVal))
      .slice(0, 8);
    datalistEl.innerHTML = matches.map(v => `<option value="${v}">`).join('');
  });
}

function loadQuestion() {
  solvedCurrent = false;
  currentImageIndex = 0;
  resultBanner.textContent = '';
  resultBanner.className = 'result-banner';
  [inputCommon, inputScientific, inputFamily].forEach(inp => {
    inp.value = '';
    inp.classList.remove('correct', 'incorrect');
    inp.disabled = false;
  });
  datalistCommon.innerHTML = '';
  datalistFamily.innerHTML = '';
  [revealCommon, revealScientific, revealFamily].forEach(r => {
    r.classList.remove('show');
    r.textContent = '';
  });
  validateBtn.textContent = 'Valider';
  validateBtn.disabled = false;
  skipBtn.style.display = 'inline-block';
  skipBtn.disabled = false;

  loadImage();
  updateProgress();
  updateScoreLabel();
  inputFamily.focus();
}

function loadImage() {
  const plant = order[currentIndex];
  const images = plant.images && plant.images.length ? plant.images : [];
  imgEl.style.display = 'block';
  imgPlaceholder.style.display = 'none';

  // Réinitialise le drag/pan avant le chargement de la nouvelle image
  isDraggingImg = false;
  imgHasOverflow = false;
  dragOffsetX = 0;
  dragOffsetY = 0;
  imgEl.style.width = '100%';
  imgEl.style.height = '100%';
  imgEl.style.transform = 'translate(0px, 0px)';
  imgResetBtn.style.display = 'none';
  imageDragHint.style.display = 'none';

  if (images.length > 0) {
    imgEl.src = images[currentImageIndex];
    imgPathHint.textContent = images[currentImageIndex];
  } else {
    imgEl.src = '';
    imgPathHint.textContent = '(aucune image renseignée)';
  }

  const multi = images.length > 1;
  imgPrevBtn.style.display = multi ? 'flex' : 'none';
  imgNextBtn.style.display = multi ? 'flex' : 'none';

  imageDots.innerHTML = '';
  if (multi) {
    images.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === currentImageIndex ? ' active' : '');
      dot.addEventListener('click', () => {
        currentImageIndex = i;
        loadImage();
      });
      imageDots.appendChild(dot);
    });
  }
}

imgPrevBtn.addEventListener('click', () => {
  const plant = order[currentIndex];
  const total = plant.images.length;
  currentImageIndex = (currentImageIndex - 1 + total) % total;
  loadImage();
});

imgNextBtn.addEventListener('click', () => {
  const plant = order[currentIndex];
  const total = plant.images.length;
  currentImageIndex = (currentImageIndex + 1) % total;
  loadImage();
});

function updateProgress() {
  const pct = (currentIndex / order.length) * 100;
  progressFill.style.width = pct + '%';
}

function updateScoreLabel() {
  scoreLabel.textContent = `Score : ${score} / ${order.length}`;
}

function checkAnswers() {
  const plant = order[currentIndex];
  const userCommon = normalize(inputCommon.value);
  const userScientific = normalize(inputScientific.value);
  const userFamily = normalizeFamily(inputFamily.value);

  const okCommon = userCommon === normalize(plant.common);
  const okScientific = userScientific === normalize(plant.scientific);
  const okFamily = userFamily === normalizeFamily(plant.family);

  inputCommon.classList.toggle('correct', okCommon);
  inputCommon.classList.toggle('incorrect', !okCommon);
  inputScientific.classList.toggle('correct', okScientific);
  inputScientific.classList.toggle('incorrect', !okScientific);
  inputFamily.classList.toggle('correct', okFamily);
  inputFamily.classList.toggle('incorrect', !okFamily);

  if (!okCommon) { revealCommon.textContent = 'Réponse : ' + plant.common; revealCommon.classList.add('show'); }
  if (!okScientific) { revealScientific.textContent = 'Réponse : ' + plant.scientific; revealScientific.classList.add('show'); }
  if (!okFamily) { revealFamily.textContent = 'Réponse : ' + plant.family; revealFamily.classList.add('show'); }

  const allOk = okCommon && okScientific && okFamily;

  if (allOk) {
    resultBanner.textContent = '✅ Bravo, les trois réponses sont correctes !';
    resultBanner.className = 'result-banner ok';
    score++;
  } else {
    resultBanner.textContent = '❌ Au moins une réponse est incorrecte. La bonne réponse est affichée ci-dessus.';
    resultBanner.className = 'result-banner ko';
    missed.push(plant);
  }

  updateScoreLabel();
  solvedCurrent = true;
  validateBtn.textContent = 'Suivant →';
  skipBtn.style.display = 'none';
  [inputCommon, inputScientific, inputFamily].forEach(inp => inp.disabled = true);
}

function revealAnswersForSkip() {
  const plant = order[currentIndex];
  revealCommon.textContent = 'Réponse : ' + plant.common;
  revealCommon.classList.add('show');
  revealScientific.textContent = 'Réponse : ' + plant.scientific;
  revealScientific.classList.add('show');
  revealFamily.textContent = 'Réponse : ' + plant.family;
  revealFamily.classList.add('show');
}

validateBtn.addEventListener('click', () => {
  if (!solvedCurrent) {
    checkAnswers();
  } else {
    goToNext();
  }
});

skipBtn.addEventListener('click', () => {
  const plant = order[currentIndex];
  missed.push(plant);
  revealAnswersForSkip();
  resultBanner.textContent = 'Question passée — les réponses sont affichées ci-dessus.';
  resultBanner.className = 'result-banner ko';
  [inputCommon, inputScientific, inputFamily].forEach(inp => inp.disabled = true);
  skipBtn.style.display = 'none';
  validateBtn.textContent = 'Suivant →';
  solvedCurrent = true;
});

function goToNext() {
  currentIndex++;
  if (currentIndex < order.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  quizScreen.style.display = 'none';
  resultScreen.style.display = 'block';
  progressFill.style.width = '100%';
  finalScore.textContent = `${score} / ${order.length}`;
  const pct = Math.round((score / order.length) * 100);
  let msg;
  if (pct === 100) msg = "Parfait ! Vous maîtrisez toutes les plantes de la liste 🌱";
  else if (pct >= 70) msg = "Très bien ! Encore quelques révisions pour être imbattable 🌿";
  else if (pct >= 40) msg = "Pas mal, continuez à réviser les espèces manquées 🌾";
  else msg = "Encore du travail — revoyez les fiches des plantes ratées 🌻";
  resultMessage.textContent = msg;

  if (missed.length > 0) {
    missedList.style.display = 'block';
    missedList.innerHTML = '<strong>Plantes à revoir :</strong><ul>' +
      missed.map(p => `<li>${p.common} — <em>${p.scientific}</em> (${p.family})</li>`).join('') +
      '</ul>';
  } else {
    missedList.style.display = 'none';
  }
}

restartBtn.addEventListener('click', () => {
  currentIndex = 0;
  score = 0;
  missed = [];
  order = shuffle(plants);
  quizScreen.style.display = 'block';
  resultScreen.style.display = 'none';
  loadQuestion();
});

// Valider avec la touche Entrée
[inputCommon, inputScientific, inputFamily].forEach(inp => {
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      validateBtn.click();
    }
  });
});

/* ============================================================
   PRÉCHARGEMENT DES IMAGES
   Toutes les images de toutes les plantes sont chargées avant
   de démarrer le quiz, pour éviter tout temps d'attente pendant
   le jeu. Un écran de chargement affiche la progression.
   ============================================================ */
const loadingScreen = document.getElementById('loading-screen');
const loadingText = document.getElementById('loading-text');
const loadingSubtext = document.getElementById('loading-subtext');
const loadingProgressFill = document.getElementById('loading-progress-fill');

function preloadAllImages(onComplete) {
  const paths = [];
  plants.forEach(p => (p.images || []).forEach(src => paths.push(src)));
  const total = paths.length;

  if (total === 0) {
    onComplete();
    return;
  }

  let done = 0;
  loadingSubtext.textContent = `0 / ${total}`;

  paths.forEach(src => {
    const img = new Image();
    const markDone = () => {
      done++;
      loadingSubtext.textContent = `${done} / ${total}`;
      loadingProgressFill.style.width = (done / total * 100) + '%';
      if (done === total) onComplete();
    };
    img.onload = markDone;
    img.onerror = markDone; // une image manquante ne doit pas bloquer le chargement
    img.src = src;
  });
}

function hideLoadingScreen() {
  loadingScreen.style.display = 'none';
  quizScreen.style.display = 'block';
}

// Initialisation
setupDynamicAutocomplete(inputCommon, datalistCommon, allCommons);
//setupDynamicAutocomplete(inputFamily, datalistFamily, allFamilies);
order = shuffle(plants);
preloadAllImages(() => {
  hideLoadingScreen();
  loadQuestion();
});
</script>
